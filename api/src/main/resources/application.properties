spring.application.name=api

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:novalectura}?createDatabaseIfNotExist=true&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:novalectura-clave-solo-para-desarrollo-cambiar-en-deployment}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

app.admin.correo=${ADMIN_CORREO:admin@novalectura.com}
app.admin.contrasena=${ADMIN_CONTRASENA:Admin12345}

app.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
app.uploads.limpieza-cron=${UPLOADS_LIMPIEZA_CRON:0 0 3 * * *}
app.uploads.retencion-horas=${UPLOADS_RETENCION_HORAS:24}
