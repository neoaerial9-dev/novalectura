<header class="navbar">
  <a class="brand" routerLink="/catalogo" aria-label="Nova Lectura, catálogo">
    <span class="brand-icon" aria-hidden="true">▤</span>
    <span>Nova Lectura</span>
  </a>

  <nav class="navigations" aria-label="Navegación principal">
    <a routerLink="/catalogo" fragment="inicio">Inicio</a>
    <a routerLink="/catalogo">Catálogo</a>
    <a *ngIf="user?.rol === 'ADMIN'" routerLink="/admin/usuarios">Usuarios</a>
    <a *ngIf="user?.rol === 'ADMIN'" routerLink="/admin/libros">Productos</a>
  </nav>

  <div class="header-actions">
    <button
      class="cart-link"
      type="button"
      (click)="openCart()"
      [attr.aria-label]="'Abrir carrito con ' + (cartCount$ | async) + ' productos'"
      title="Ver carrito">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h8.9a2 2 0 0 0 1.9-1.4L22 8H6"></path>
        <circle cx="10" cy="20" r="1.3"></circle>
        <circle cx="18" cy="20" r="1.3"></circle>
      </svg>
      <span *ngIf="(cartCount$ | async) as count" class="cart-count">{{ count }}</span>
    </button>
    <span *ngIf="cartLoadError" class="cart-error" role="status">{{ cartLoadError }}</span>
    <a *ngIf="isAuthenticated" class="account-link" routerLink="/cuenta"
      [attr.aria-label]="'Perfil de ' + user?.nombres" title="Mi perfil">
      {{ initials }}
    </a>
    <a *ngIf="!isAuthenticated" class="login-link" routerLink="/login">Ingresar</a>
  </div>
</header>
